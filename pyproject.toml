[project]
name = "offramp"
version = "0.1.0"
description = "ETH off-ramp helper: OKX maker buy + 1x short hedge, manual OSL sell with synced hedge close"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
offramp = "offramp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
